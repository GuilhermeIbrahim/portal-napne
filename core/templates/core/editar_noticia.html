<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Notícia - Portal NAPNE</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        a { color: #2c6e49; }
        form p { margin-bottom: 15px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            background-color: #2c6e49;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="{% url 'detalhe' noticia.id %}">&larr; Voltar para a notícia</a>

    <h1>Editar Notícia</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar alterações</button>
    </form>

</body>
</html>
