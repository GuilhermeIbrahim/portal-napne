<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notícias - Portal NAPNE</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .botao-criar {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #2c6e49;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        .noticia {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .noticia img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 10px 0;
        }
        .noticia h2 a {
            color: #222;
            text-decoration: none;
        }
        .noticia h2 a:hover {
            text-decoration: underline;
        }
        .data {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Notícias</h1>

    <a class="botao-criar" href="{% url 'criar_noticia' %}">+ Nova notícia</a>

    {% for noticia in noticias %}
        <div class="noticia">
            <h2><a href="{% url 'detalhe' noticia.id %}">{{ noticia.titulo }}</a></h2>

            {% if noticia.imagem %}
                <img src="{{ noticia.imagem.url }}" alt="{{ noticia.titulo }}">
            {% endif %}

            <p>{{ noticia.conteudo }}</p>
            <p class="data">Publicado em: {{ noticia.data }}</p>
        </div>
    {% empty %}
        <p>Nenhuma notícia cadastrada ainda.</p>
    {% endfor %}

</body>
</html>
