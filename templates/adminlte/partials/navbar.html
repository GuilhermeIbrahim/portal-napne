{% load static %}
<nav class="app-header {{ adminlte.classes_topnav }} navbar" aria-label="Barra superior do painel">
    <div class="{{ adminlte.classes_topnav_container }}">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Abrir ou fechar o menu lateral">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </a>
            </li>
            <li class="nav-item d-none d-md-block">
                <a href="{% url 'painel_home' %}" class="nav-link">
                    <i class="bi bi-grid-1x2 me-1" aria-hidden="true"></i> Painel
                </a>
            </li>
            <li class="nav-item d-none d-md-block">
                <a href="{% url 'index' %}" class="nav-link">
                    <i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i> Site público
                </a>
            </li>
        </ul>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="#" data-lte-toggle="fullscreen" aria-label="Alternar tela cheia">
                    <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
                    <i data-lte-icon="minimize" class="bi bi-fullscreen-exit d-none" aria-hidden="true"></i>
                </a>
            </li>

            <li class="nav-item dropdown user-menu">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle" aria-hidden="true"></i>
                    <span class="d-none d-md-inline">
                        {% if user.is_authenticated %}{{ user.first_name|default:user.get_username }}{% else %}Visitante{% endif %}
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    {% if user.is_authenticated %}
                        <li>
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">
                                    <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Sair
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li>
                            <a href="{% url 'login' %}" class="dropdown-item">
                                <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Entrar
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </li>
        </ul>
    </div>
</nav>
