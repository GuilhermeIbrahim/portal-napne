{% load adminlte %}
{% if messages %}
<div class="adminlte-messages">
  {% for message in messages %}
    <div class="alert alert-{{ message|adminlte_alert_class }} alert-dismissible fade show d-flex align-items-center" role="alert">
      <i class="{{ message|adminlte_alert_icon }} flex-shrink-0 me-2" aria-hidden="true"></i>
      <div>{{ message }}</div>
      <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
