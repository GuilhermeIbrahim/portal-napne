{% extends "portal/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Enviar PEI | Portal NAPNE{% endblock %}

{% block content %}

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'index' %}">Notícias</a></li>
            <li class="breadcrumb-item active">Enviar PEI</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h1 class="h5 mb-0">Enviar PEI ao NAPNE</h1>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% crispy form form.helper %}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Enviar
                    </button>
                    <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
