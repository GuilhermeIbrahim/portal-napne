{% extends "portal/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Entrar como NAPNE | Portal NAPNE{% endblock %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h1 class="h5 mb-0">Entrar como membro do NAPNE</h1>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% crispy form form.helper %}
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Entrar</button>
                            <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                    <hr>
                    <p class="mb-0 small">Ainda não tem cadastro? <a href="{% url 'cadastro_napne' %}">Cadastre-se aqui</a>.</p>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
